<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل صاحب ورشة</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.staging.js"></script></head>
<body class="bg-slate-100 min-h-screen p-4"><main class="max-w-lg mx-auto mt-10 bg-white rounded-2xl shadow p-6 space-y-4">
<h1 class="text-2xl font-black">تسجيل صاحب ورشة</h1><p class="text-sm text-slate-600">أنشئ حساباً بالبريد وكلمة المرور. بعد التسجيل سيظهر UID؛ أرسله لمدير المنصة لربط حسابك بورشتك.</p>
<input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full border rounded-xl p-3">
<input id="password" type="password" minlength="8" placeholder="كلمة المرور (8 أحرف على الأقل)" class="w-full border rounded-xl p-3">
<button id="signup" class="w-full bg-indigo-600 text-white rounded-xl p-3 font-bold">إنشاء الحساب</button>
<div id="result" class="hidden rounded-xl bg-emerald-50 p-4 text-sm break-all"></div><p id="error" class="text-sm text-rose-700"></p>
</main>
<script>
const app=firebase.initializeApp(window.AliFirebaseConfig), auth=firebase.auth();
document.getElementById("signup").addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim(), password=document.getElementById("password").value;
 const err=document.getElementById("error"), out=document.getElementById("result"); err.textContent=""; out.classList.add("hidden");
 try{const cred=await auth.createUserWithEmailAndPassword(email,password); out.innerHTML="<strong>تم إنشاء الحساب.</strong><br>UID: <code></code><br>انسخ UID وأرسله لمدير المنصة.";out.querySelector("code").textContent=cred.user.uid;out.classList.remove("hidden");}
 catch(e){err.textContent=e.message;}
});
</script></body></html>
