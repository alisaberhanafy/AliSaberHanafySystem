name: Validate project

on:
  push:
  pull_request:

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          find assets/js -name '*.js' -print0 | xargs -0 -r -n1 node --check
          if [ -f catalog-data.js ]; then node --check catalog-data.js; fi
          node --check platform/public/platform-admin.js
          node --check platform/public/firebase-config.staging.js

      - name: Run project tests
        run: |
          node tests/finance.test.cjs
          node tests/auth-config.test.cjs
          node tests/platform-architecture.test.cjs
          node tests/zero-cost-platform.test.cjs

      - name: Validate Firebase configuration and rules
        run: |
          node -e "JSON.parse(require('fs').readFileSync('platform/firebase.staging.json','utf8')); JSON.parse(require('fs').readFileSync('platform/database.rules.spark.json','utf8'))"
