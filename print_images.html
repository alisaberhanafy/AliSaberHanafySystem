<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طباعة الصورة / المستند</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; }
        img { max-width: 100%; height: auto; }
        @media print {
            body { margin: 0; }
            img { max-width: 100%; height: auto; page-break-after: avoid; }
        }
    </style>
</head>
<body>
    <img id="print-image-target" src="" alt="صورة للطباعة">
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const imgSrc = urlParams.get('img');
        if (imgSrc) {
            const imgEl = document.getElementById('print-image-target');
            imgEl.src = imgSrc;
            imgEl.onload = () => window.print();
        }
    </script>
</body>
</html>
